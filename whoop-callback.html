<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connecting Whoop...</title>
<style>
  body { background: #0f1117; color: #e8edf5; font-family: Georgia, serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .msg { text-align: center; }
  .msg div:first-child { font-size: 32px; margin-bottom: 12px; }
  .msg p { color: #6b7a90; font-size: 15px; }
  .error { color: #f87171; }
</style>
</head>
<body>
<div class="msg" id="msg">
  <div>⏳</div>
  <p>Connecting to Whoop...</p>
</div>
<script>
const WHOOP_AUTH_URL = "https://whoopauth-998100432483.us-central1.run.app";

async function handleCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const error = params.get("error");

  if (error || !code) {
    show("❌", "Authorization failed. Close this tab and try again.", true);
    return;
  }

  try {
    const res = await fetch(WHOOP_AUTH_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code })
    });

    const data = await res.json();

    if (data.access_token) {
      localStorage.setItem("whoop_access_token", data.access_token);
      if (data.refresh_token) localStorage.setItem("whoop_refresh_token", data.refresh_token);
      show("✅", "Whoop connected! Returning to app...");
      setTimeout(() => { window.location.href = "/"; }, 1500);
    } else {
      show("❌", "Could not get token: " + (data.error || "Unknown error"), true);
    }
  } catch (err) {
    show("❌", "Request failed: " + err.message, true);
  }
}

function show(icon, text, isError) {
  document.getElementById("msg").innerHTML =
    `<div>${icon}</div><p class="${isError ? "error" : ""}">${text}</p>`;
}

handleCallback();
</script>
</body>
</html>
