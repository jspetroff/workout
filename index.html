function getWhoopRefreshToken() { return localStorage.getItem("whoop_refresh_token"); }

function connectWhoop() {
  const url = "https://api.prod.whoop.com/oauth/oauth2/auth?" + new URLSearchParams({
    response_type: "code",
    client_id: WHOOP_CLIENT_ID,
    redirect_uri: WHOOP_REDIRECT,
    scope: "offline read:recovery read:cycles",
    state: "workout-app"
  });
  window.location.href = url;
}

function whoopDisconnect() {
  localStorage.removeItem("whoop_access_token");

}

window.disconnectWhoop = async function() {
  if (!DOC_REF) return;

    whoopRefreshToken: null,
    whoopTokenExpired: false

};

async function fetchWhoopHRV() {
  try {
    const res = await fetch(WHOOP_HRV_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({})
    });
    const data = await res.json();
    if (res.status === 401) {
      return { hrv: null, expired: true };
    }
    return { hrv: data.hrv || null, expired: false };
  } catch (e) { return { hrv: null, expired: false }; }
}

function getWeekKey(off) {
  const now = new Date();
  const day = now.getDay();
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (day === 0 ? 6 : day - 1) + (off||0)*7);
  return `${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`;
}
function fmtDate(iso) { return new Date(iso+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function last7() {
  return Array.from({length:7},(_,i)=>{
    const d=new Date();
    d.setDate(d.getDate()-(6-i));
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  });
}
function lc(load) { return load==="normal"?"#4ade80":load==="heavy"?"#fbbf24":load==="a lot"?"#f87171":"#2a3545"; }

function esc(s) { return (""+( s||"")).replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

// Single source of truth for "did anything happen on this day" — used by the
// day-tab dot, the Log tab, and the readiness recommendation's recent-session
// lookup. Previously each of those three places had its own incomplete copy
// of this check (missing checked exercises, weights, custom exercises,
// modality, avgHR, hrAnalysis) which is why a fully-logged Monday workout
// could show no dot and no Log entry.
function hasSessionContent(data) {
  if (!data) return false;
  if (data.feel||data.rpe||data.sessionNote||data.restDay||data.yogaDone||data.fridgePick||data.activity||data.modality||data.avgHR||data.hrAnalysis) return true;
  if (data.checked && Object.values(data.checked).some(Boolean)) return true;
  if (data.weights && Object.values(data.weights).some(v=>v)) return true;
  if (data.customExercises && data.customExercises.length>0) return true;
  return false;
}

// Converts a session key like "2026-07-13_Wed" into an actual Date object.
// Needed because DAYS is in weekday order, not alphabetical order — sorting
// session keys as plain strings scrambles same-week days (Fri < Mon < Sat <
// Sun < Thu < Tue < Wed alphabetically), which is not chronological order.
function sessionKeyToDate(key) {
  const parts = key.split("_");
  if (parts.length !== 2) return null;
  const [weekIso, dayName] = parts;
  const dayIdx = DAYS.indexOf(dayName);
  if (dayIdx < 0) return null;
  const d = new Date(weekIso + "T12:00:00");
  if (isNaN(d)) return null;
  d.setDate(d.getDate() + dayIdx);
  return d;
}

// Looks up the most recent weight logged for a given exercise name, searching
// across ALL sessions (any day, any week) — the same movement can show up on
// different days. Sorted by real resolved date, not by string comparison.
function getLastWeight(name, excludeKey) {
  const entries = Object.keys(S.sessions)
    .filter(k => k !== excludeKey && S.sessions[k]?.weights?.[name])
    .map(k => ({ key:k, date: sessionKeyToDate(k), value: S.sessions[k].weights[name] }))
    .filter(e => e.date)
    .sort((a,b) => b.date - a.date);
  if (!entries.length) return null;
  return { value: entries[0].value, key: entries[0].key };
}

// Full chronological weight history for a given exercise name, oldest first —
// powers the expandable progression view under each weight input.
function getWeightHistory(name) {
  return Object.keys(S.sessions)
    .filter(k => S.sessions[k]?.weights?.[name])
    .map(k => ({ date: sessionKeyToDate(k), value: S.sessions[k].weights[name] }))
    .filter(e => e.date)
    .sort((a,b) => a.date - b.date);
}

// Recovery-based plan suggestion for Mon/Thu. Poor recovery -> suggest the
// moderate-intensity variant. Otherwise -> suggest a high-intensity variant,
// preferring one that's not simply a repeat of last week's exact plan.
function getStrengthSuggestion(dayName, plans, planField) {
  const ak = todayKey();
  const todayRec = S.recovery[ak] || {};
  const streak = getHRVStreak();
  const poorRecovery = streak >= 3 || todayRec.load === "a lot";
  const heavyLoad = todayRec.load === "heavy";

  const lastWeekSess = getSess(S.weekOffset - 1, dayName);
  const lastPlanIdx = lastWeekSess[planField];
  const lastPlan = lastPlanIdx !== undefined ? plans[lastPlanIdx] : null;

  if (poorRecovery) {
    const idx = plans.findIndex(p => p.intensity === "moderate");
    if (idx < 0) return null;
    return {
      idx,
      reason: streak >= 3
        ? `HRV down ${streak} days in a row — back off to Plan ${plans[idx].label} today.`
        : "A lot going on — Plan " + plans[idx].label + " keeps you moving without piling on."
    };
  }
  if (heavyLoad) {
    const idx = plans.findIndex(p => p.intensity === "moderate");
    if (idx < 0) return null;
    return { idx, reason: "Life load is heavy — Plan " + plans[idx].label + " today." };
  }
  const highIdxs = plans.map((p,i)=>({p,i})).filter(x=>x.p.intensity==="high").map(x=>x.i);
  if (!highIdxs.length) return null;
  let idx = highIdxs.find(i => i !== lastPlanIdx);
  if (idx === undefined) idx = highIdxs[0];
  return {
    idx,
    reason: lastPlan
      ? `Recovered well — Plan ${plans[idx].label} hasn't come up as recently as Plan ${lastPlan.label}.`
      : "Recovered well — go heavy with Plan " + plans[idx].label + "."
  };
}

// ─── Firebase ────────────────────────────────────────────────────────────────

let db = null;
let DOC_REF = null;
let currentUser = null;

async function initFirebase() {
  if (db) return true;
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const { getFirestore, doc, getDoc, setDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");

    const fbApp = initializeApp(FIREBASE_CONFIG);
    db = getFirestore(fbApp);
    DOC_REF = doc(db, "users", "jp");
    window._fbGetDoc = getDoc;
    window._fbSetDoc = setDoc;

    const auth = getAuth(fbApp);
    const provider = new GoogleAuthProvider();

    document.getElementById("sign-in-btn").addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        document.getElementById("auth-error").textContent = "Sign-in failed: " + e.message;
      }
    });

    return new Promise((resolve) => {
      onAuthStateChanged(auth, (user) => {
        currentUser = user;
        if (user) {
          if (user.email === "jspetroff@gmail.com") {
            document.getElementById("auth-screen").style.display = "none";
            document.getElementById("app").style.display = "block";
            loadFromFirebase();
          } else {
            document.getElementById("auth-screen").style.display = "flex";
            document.getElementById("app").style.display = "none";
            document.getElementById("auth-error").textContent = "Wrong account. Sign in with jspetroff@gmail.com.";
            auth.signOut();
          }
        } else {
          document.getElementById("auth-screen").style.display = "flex";
          document.getElementById("app").style.display = "none";
        }
        resolve(!!user);
      });
    });
  } catch (e) {
    console.error("Firebase init failed:", e);
    return false;
  }
}

let dataLoaded = false;

async function loadFromFirebase() {
  try {
    const snap = await window._fbGetDoc(DOC_REF);
    if (snap.exists()) {
      const data = snap.data();
      S.sessions = data.sessions || {};
      S.recovery = data.recovery || {};
      S.videoQueue = data.videoQueue || [];
      S.whoopConnected = !!(data.whoopAccessToken && !data.whoopTokenExpired);
      localStorage.setItem("pp_sessions_backup", JSON.stringify(S.sessions));
      localStorage.setItem("pp_recovery_backup", JSON.stringify(S.recovery));
      localStorage.setItem("pp_queue_backup", JSON.stringify(S.videoQueue));
    }
    dataLoaded = true;
    renderAll();
    showBanner("Data loaded", "saved");
    autoFetchOnLoad();
  } catch (e) {
    const sessBackup = localStorage.getItem("pp_sessions_backup");
    const recBackup = localStorage.getItem("pp_recovery_backup");
    const queueBackup = localStorage.getItem("pp_queue_backup");
    if (sessBackup) S.sessions = JSON.parse(sessBackup);
    if (recBackup) S.recovery = JSON.parse(recBackup);
    if (queueBackup) S.videoQueue = JSON.parse(queueBackup);
    dataLoaded = true;
    showBanner("Load failed — using local backup", "error");
    renderAll();
    autoFetchOnLoad();
  }
}

function showBanner(msg, type) {
  setSaveStatus(type);
  const el = document.getElementById("save-badge");
  if (el) el.textContent = msg;
  setTimeout(() => setSaveStatus("idle"), 4000);
}

async function saveToFirebase() {
  if (!db || !DOC_REF) return;
  if (!dataLoaded) return;
  try {
    await window._fbSetDoc(DOC_REF, {sessions:S.sessions, recovery:S.recovery, videoQueue:S.videoQueue}, {merge:true});
    localStorage.setItem("pp_sessions_backup", JSON.stringify(S.sessions));
    localStorage.setItem("pp_recovery_backup", JSON.stringify(S.recovery));
    localStorage.setItem("pp_queue_backup", JSON.stringify(S.videoQueue));
    setSaveStatus("saved");
    setTimeout(() => setSaveStatus("idle"), 2000);
  } catch (e) {
    setSaveStatus("error");
    setTimeout(() => setSaveStatus("idle"), 3000);
  }
}

function scheduleSave() {
  setSaveStatus("saving");
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToFirebase, 1000);
}

function setSaveStatus(s) {
  S.saveStatus = s;
  const el = document.getElementById("save-badge");
  if (!el) return;
  if (s === "idle") { el.style.display = "none"; return; }
  el.style.display = "block";
  el.style.background = s==="saved"?"#1e3a2a":s==="error"?"#2d1515":"#1a2030";
  el.style.borderColor = s==="saved"?"#4ade80":s==="error"?"#f87171":"#2a3545";
  el.style.color = s==="saved"?"#4ade80":s==="error"?"#f87171":"#6b7a90";
  el.textContent = s==="saving"?"Saving...":s==="saved"?"✓ Saved":"✗ Save failed";
}

// ─── Readiness ───────────────────────────────────────────────────────────────

window.getReadiness = async function() {
  const el = document.getElementById("readiness-result");
  if (!el) return;
  el.innerHTML = '<div style="background:#141b26;border-radius:10px;padding:12px 14px;color:#6b7a90;font-size:13px;">Getting recommendation...</div>';
  const ak = S.recoveryActiveKey;
  const hrv = S.recovery[ak]?.hrv;
  const load = S.recovery[ak]?.load;
  const recentSessions = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const dayName = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
    const sess = S.sessions[getWeekKey(0)+"_"+dayName] || S.sessions[getWeekKey(-1)+"_"+dayName];
    if (sess && hasSessionContent(sess)) recentSessions.push({day:dayName, rpe:sess.rpe, feel:sess.feel});
  }
  const todayDay = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date().getDay()];
  const planMap = {
    Mon: "Monday Strength — choose Plan A (Squat + Press + Pull + Glute), Plan B (Bulgarian Split Squat + Row + Press + Glute), or Plan C (Squat Variation + Pull + Press + Glute)",
    Tue: "Tuesday Yoga — Leigh's heated vinyasa class",
    Wed: "Wednesday N4x4 Run or Pool Swim with Kevin",
    Thu: "Thursday Strength + Explosive — choose Plan A (Hinge Heavy + Explosive + Press + Pull), Plan B (Power Day: Jumps + RDL + Press + Pull), or Plan C (Explosive + Posterior Chain + Press + Pull)",
    Fri: "Friday Variable Day — options are Yoga, Pilates, Easy Zone 2 Run, Pool Swim, Kettlebells, N4x4 Run, or Rest"
  };
  const todayPlan = planMap[todayDay] || "Weekend active recovery";
  const last7keys = last7();
  const hrvValues = last7keys.map(k => S.recovery[k]?.hrv).filter(Boolean).map(Number);
  const hrvAvg = hrvValues.length ? Math.round(hrvValues.reduce((a,b)=>a+b,0)/hrvValues.length) : null;
  try {
    const res = await fetch("https://getreadiness-998100432483.us-central1.run.app", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({hrv, hrvAvg, load, recentSessions, todayPlan})
    });
    const data = await res.json();
    const text = data.recommendation || "Could not get recommendation.";
    el.innerHTML = `<div style="background:#141b26;border-radius:10px;padding:14px;border:1px solid #1e3a2a;"><div style="color:#4ade80;font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:8px;">TODAY'S RECOMMENDATION</div><div style="color:#c8d4e8;font-size:14px;line-height:1.6;">${text}</div></div>`;
  } catch (err) {
    el.innerHTML = '<div style="color:#f87171;font-size:13px;padding:10px 0;">Could not get recommendation.</div>';
  }
};

// ─── HR Chart Analysis ───────────────────────────────────────────────────────

window.analyzeHRChart = async function(event) {
  const file = event.target.files[0];
  if (!file) return;
  const el = document.getElementById("hr-analysis");
  if (!el) return;
  el.innerHTML = '<div style="color:#6b7a90;font-size:13px;padding:10px 0;">Analyzing your HR chart...</div>';
  const reader = new FileReader();
  reader.onload = async function(e) {
    const base64 = e.target.result.split(",")[1];
    const mediaType = file.type || "image/jpeg";
    try {
      const res = await fetch("https://analyzehr-998100432483.us-central1.run.app", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({imageBase64: base64, mediaType})
      });
      const data = await res.json();
      const text = data.analysis || "Could not analyze image.";
      el.innerHTML = `<div style="background:#141b26;border-radius:8px;padding:12px;margin-top:4px;color:#c8d4e8;font-size:13px;line-height:1.6;white-space:pre-wrap;">${text}</div>`;
      setSessionField("hrAnalysis", text);
    } catch (err) {
      el.innerHTML = '<div style="color:#f87171;font-size:13px;padding:10px 0;">Analysis failed: ' + err.message + '</div>';
    }
  };
  reader.readAsDataURL(file);
};

function renderRecovery() {
  const el=document.getElementById("recovery-content"); if(!el) return;
  const tk=todayKey(),ak=S.recoveryActiveKey;
  const aData=S.recovery[ak]||{};
  const keys=last7();
  const hrvVals=keys.map(k=>({date:k,hrv:S.recovery[k]?.hrv,load:S.recovery[k]?.load}));
  const hasHRV=hrvVals.some(v=>v.hrv);
  const recent=keys.map(k=>S.recovery[k]?.hrv).filter(Boolean).map(Number);
  let streak=0;
  if(recent.length>=3){for(let i=recent.length-1;i>0;i--){if(recent[i]<recent[i-1])streak++;else break;}}
  const alert=streak>=3;
  const dayPills=keys.map(k=>{
    const dn=new Date(k+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"});
    const hasE=!!(S.recovery[k]?.hrv),isAct=k===ak;
    return `<button onclick="setRecoveryDay('${k}')" style="flex-shrink:0;padding:6px 10px;border-radius:20px;border:${isAct?"none":"1px solid #2a3545"};background:${isAct?"#4ade80":"#141b26"};color:${isAct?"#0f1117":hasE?"#c8d4e8":"#6b7a90"};font-weight:700;font-size:13px;cursor:pointer;position:relative;">${k===tk?"Today":dn}${hasE&&!isAct?`<span style="position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:#4ade80;"></span>`:""}</button>`;
  }).join("");
  const loadBtns=[["normal","Normal"],["heavy","Heavy"],["a lot","A lot going on"]].map(([v,l])=>`<button onclick="setRecoveryLoad('${v}')" style="flex:1;padding:10px 6px;border-radius:8px;border:${aData.load===v?"none":"1px solid #2a3545"};background:${aData.load===v?lc(v):"#1a2030"};color:${aData.load===v?"#0f1117":"#9bacc0"};font-weight:600;font-size:12px;cursor:pointer;line-height:1.3;">${l}</button>`).join("");
  let trendHTML="";
  if(hasHRV){
    const vals=hrvVals.map(v=>Number(v.hrv)||null);
    const max=Math.max(...vals.filter(Boolean)),min=Math.min(...vals.filter(Boolean)),range=max-min||1;
    const bars=hrvVals.map((v,i)=>{
      const val=Number(v.hrv)||null,h=val?Math.max(12,((val-min)/range)*64+12):4,isAct=v.date===ak;
      const dn=new Date(v.date+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"});
      return `<div onclick="setRecoveryDay('${v.date}')" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;">
        <div style="font-size:10px;color:#6b7a90;">${val||""}</div>
        <div style="width:100%;height:${h}px;border-radius:4px;background:${!val?"#1a2030":v.date===tk?"#4ade80":v.load?lc(v.load):"#3a5a80"};outline:${isAct?"2px solid #fff":"none"};"></div>
        <div style="font-size:10px;color:${isAct?"#e8edf5":"#6b7a90"};">${dn}</div>
      </div>`;
    }).join("");
    trendHTML=`<div style="background:#141b26;border-radius:10px;padding:14px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;">
        <div style="color:#4ade80;font-size:12px;font-weight:700;letter-spacing:1px;">7-DAY TREND</div>
        ${(()=>{ const avg=(vals.filter(Boolean).reduce((a,b)=>a+b,0)/(vals.filter(Boolean).length||1)).toFixed(1); return vals.filter(Boolean).length?`<div style="color:#6b7a90;font-size:12px;">7-day avg: <span style="color:#e8edf5;font-weight:700;">${avg}</span></div>`:""; })()}
      </div>
      <div style="display:flex;align-items:flex-end;gap:4px;height:80px;margin-bottom:10px;">${bars}</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">${[["#4ade80","Normal"],["#fbbf24","Heavy"],["#f87171","A lot going on"],["#3a5a80","No load logged"]].map(([c,l])=>`<div style="display:flex;align-items:center;gap:4px;"><div style="width:8px;height:8px;border-radius:2px;background:${c};"></div><span style="color:#6b7a90;font-size:11px;">${l}</span></div>`).join("")}</div>
    </div>`;
  }
  const dateLabel=ak===tk?"TODAY":new Date(ak+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"}).toUpperCase();
  el.innerHTML=`
    ${alert?`<div style="background:#2d1515;border:1px solid #f87171;border-radius:10px;padding:12px 14px;margin-bottom:16px;"><div style="color:#f87171;font-weight:700;font-size:14px;margin-bottom:4px;">HRV down ${streak} days in a row</div><div style="color:#9bacc0;font-size:13px;">Injury risk elevated. Dial back today — not forever, just today.</div></div>`:""}
    <div style="display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;">${dayPills}</div>
    <div style="background:#141b26;border-radius:10px;padding:14px;margin-bottom:16px;">
      <div style="color:#4ade80;font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:12px;">${dateLabel}</div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <div style="color:#6b7a90;font-size:12px;">HRV</div>
          ${whoopConnected()?`<div style="display:flex;gap:8px;align-items:center;"><button onclick="autoFillHRV()" style="background:none;border:none;color:#4ade80;font-size:12px;cursor:pointer;">&#x21BB; Fetch from Whoop</button><button onclick="disconnectWhoop()" style="background:none;border:none;color:#3a4555;font-size:11px;cursor:pointer;">disconnect</button></div>`:'<button onclick="connectWhoop()" style="background:none;border:none;color:#6b7a90;font-size:12px;cursor:pointer;">Connect Whoop</button>'}
        </div>
        <input type="number" id="hrv-input" value="${esc(aData.hrv)}" placeholder="e.g. 68" onchange="setRecoveryHRV(this.value)"
          style="width:100%;background:#1a2030;border:1px solid #2a3545;border-radius:6px;color:#e8edf5;font-size:22px;font-weight:700;padding:10px 12px;box-sizing:border-box;outline:none;text-align:center;"></div>
      <div><div style="color:#6b7a90;font-size:12px;margin-bottom:8px;">Life load</div><div style="display:flex;gap:8px;">${loadBtns}</div></div>
    </div>
    ${aData.hrv&&aData.load?`
    <button onclick="getReadiness()" style="width:100%;padding:12px 0;border-radius:10px;border:none;background:#4ade80;color:#0f1117;font-weight:700;font-size:15px;cursor:pointer;margin-bottom:16px;">
      Get today's workout recommendation
    </button>
    <div id="readiness-result" style="margin-bottom:16px;"></div>`:`
    <div style="background:#141b26;border-radius:10px;padding:12px 14px;margin-bottom:16px;color:#6b7a90;font-size:13px;text-align:center;">
      Enter HRV and life load above to get a workout recommendation
    </div>`}
    ${trendHTML}`;
}

function renderQueue() {
  const el = document.getElementById("queue-content"); if (!el) return;
  const items = S.videoQueue || [];
  const rows = items.map(item => `
    <div style="background:#141b26;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <div style="flex:1;min-width:0;">
        <div style="color:#e8edf5;font-weight:600;font-size:14px;">${esc(item.label)}</div>
        <a href="${esc(item.url)}" target="_blank" style="color:#4ade80;font-size:12px;word-break:break-all;">${esc(item.url)}</a>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        <button onclick="pullQueueItem('${item.id}')" style="padding:6px 10px;border-radius:6px;border:none;background:#4ade80;color:#0f1117;font-weight:700;font-size:12px;cursor:pointer;">Add to today</button>
        <button onclick="removeQueueItem('${item.id}')" style="background:none;border:none;color:#3a4555;font-size:16px;cursor:pointer;">&times;</button>
      </div>
    </div>`).join("");
  el.innerHTML = `
    <div style="color:#6b7a90;font-size:13px;margin-bottom:16px;">Paste links to workouts you want to try. Pull one into Monday or Thursday when you're ready to actually do it.</div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:20px;background:#141b26;border-radius:10px;padding:12px;">
      <input type="text" id="queue-label" placeholder="What is it? (e.g. 'that shoulder thing')" style="background:#1a2030;border:1px solid #2a3545;border-radius:6px;color:#e8edf5;font-size:14px;padding:8px 10px;box-sizing:border-box;outline:none;">
      <input type="text" id="queue-url" placeholder="Paste link" style="background:#1a2030;border:1px solid #2a3545;border-radius:6px;color:#e8edf5;font-size:14px;padding:8px 10px;box-sizing:border-box;outline:none;">
      <button onclick="addQueueItem()" style="padding:9px 0;border-radius:6px;border:none;background:#4ade80;color:#0f1117;font-weight:700;font-size:14px;cursor:pointer;">+ Save to queue</button>
    </div>
    ${items.length ? rows : `<div style="text-align:center;color:#6b7a90;margin-top:40px;"><div style="font-size:28px;margin-bottom:10px;">🎥</div><div>Nothing saved yet.</div></div>`}`;
}

// ─── Main Render ─────────────────────────────────────────────────────────────

function renderAll() {
  if(!document.getElementById("app-shell")) {
    document.getElementById("app").innerHTML = `
      <div id="app-shell">
        <div id="hrv-alert-banner" style="display:none;background:#2d1515;border-bottom:1px solid #f87171;padding:12px 18px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <div id="hrv-alert-heading" style="color:#f87171;font-weight:700;font-size:14px;margin-bottom:2px;">⚠️ HRV down 3+ days in a row</div>
              <div style="color:#9bacc0;font-size:13px;">Injury risk elevated. Dial back intensity today.</div>
            </div>
            <button onclick="dismissHRVAlert()" style="background:none;border:1px solid #f87171;border-radius:6px;color:#f87171;font-size:12px;padding:4px 10px;cursor:pointer;flex-shrink:0;margin-left:12px;">Got it</button>
          </div>
        </div>
        <div style="background:#0f1117;padding:16px 18px 0;position:sticky;top:0;z-index:10;border-bottom:1px solid #1e2530;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div><div style="font-size:18px;font-weight:700;">Training</div><div id="week-label" style="font-size:12px;color:#6b7a90;letter-spacing:1px;"></div></div>
            <div id="yoga-badge" style="border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700;"></div>
          </div>
          <div style="display:flex;gap:4px;" id="nav-bar"></div>
        </div>
        <div id="workouts-view" style="padding:16px 18px 80px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <button onclick="weekBack()" style="background:none;border:none;color:#6b7a90;font-size:20px;cursor:pointer;">&#8249;</button>
            <span id="week-nav-label" style="color:#6b7a90;font-size:13px;"></span>
            <button onclick="weekFwd()" style="background:none;border:none;color:#6b7a90;font-size:20px;cursor:pointer;">&#8250;</button>
          </div>
          <div id="day-tabs" style="display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;"></div>
          <div id="day-label" style="color:#6b7a90;font-size:12px;letter-spacing:1px;margin-bottom:12px;"></div>
          <div id="day-content"></div>
          <button onclick="setView('log')" style="margin-top:20px;width:100%;padding:10px 0;border-radius:8px;border:1px solid #2a3545;background:transparent;color:#6b7a90;font-size:13px;cursor:pointer;">📓 View Log</button>
        </div>
        <div id="recovery-view" style="padding:16px 18px 80px;display:none;"><div id="recovery-content"></div></div>
        <div id="log-view" style="padding:16px 18px 80px;display:none;"><div id="log-content"></div></div>
        <div id="queue-view" style="padding:16px 18px 80px;display:none;"><div id="queue-content"></div></div>
        <div id="save-badge" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);border:1px solid;border-radius:20px;padding:7px 16px;font-size:13px;z-index:100;white-space:nowrap;"></div>
      </div>`;
  }
  const nav=document.getElementById("nav-bar");
  if(nav) nav.innerHTML=[["today","Workouts"],["recovery","Recovery"],["queue","Queue"]].map(([v,label])=>`<button onclick="setView('${v}')" style="flex:1;padding:8px 0;border-radius:8px 8px 0 0;border:none;background:${S.view===v?"#141b26":"transparent"};color:${S.view===v?"#e8edf5":"#6b7a90"};font-weight:600;font-size:13px;cursor:pointer;">${label}</button>`).join("");
  ["workouts-view","recovery-view","log-view","queue-view"].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display="none";});
  const activeId=S.view==="today"?"workouts-view":S.view==="recovery"?"recovery-view":S.view==="queue"?"queue-view":"log-view";
  const av=document.getElementById(activeId); if(av) av.style.display="block";
  renderHeader();
  renderDayTabs();
  renderDay();
  renderLog();
  renderRecovery();
  renderQueue();
  renderHRVAlert();
}

// ─── HRV Alert Banner ────────────────────────────────────────────────────────

function getHRVStreak() {
  const keys = last7();
  const recent = keys.map(k => S.recovery[k]?.hrv).filter(Boolean).map(Number);
  if (recent.length < 3) return 0;
  let streak = 0;
  for (let i = recent.length - 1; i > 0; i--) {
    if (recent[i] < recent[i-1]) streak++;
    else break;
  }
  return streak;
}

function renderHRVAlert() {
  const banner = document.getElementById("hrv-alert-banner");
  if (!banner) return;
  const streak = getHRVStreak();
  if (streak < 3) { banner.style.display = "none"; return; }
  const dismissedOn = localStorage.getItem("hrv_alert_dismissed");
  if (dismissedOn === todayKey()) { banner.style.display = "none"; return; }
  banner.querySelector("#hrv-alert-heading").textContent = `⚠️ HRV down ${streak} days in a row`;
  banner.style.display = "block";
}

window.dismissHRVAlert = function() {
  localStorage.setItem("hrv_alert_dismissed", todayKey());
  const banner = document.getElementById("hrv-alert-banner");
  if (banner) banner.style.display = "none";
};

// ─── Boot ────────────────────────────────────────────────────────────────────

try {
  document.getElementById("app").style.display = "none";
  initFirebase();
} catch(e) {
  document.getElementById("app").innerHTML = '<div style="padding:24px;color:#f87171;font-size:14px;font-family:Georgia,serif;"><strong>Error:</strong> ' + e.message + '<br><br>' + e.stack + '</div>';
}
</script>
