const WHOOP_CLIENT_ID = "6bc4d1ae-871f-4f86-b921-0ffe87181234";
const WHOOP_REDIRECT = "https://workout.projectpetroff.com/whoop-callback.html";
const WHOOP_HRV_URL = "https://whoophrv-5iz3hgmcda-uc.a.run.app";

function getWhoopToken() { return localStorage.getItem("whoop_access_token"); }
function whoopConnected() { return !!getWhoopToken(); }

function connectWhoop() {
const url = "https://api.prod.whoop.com/oauth/oauth2/auth?" + new URLSearchParams({
response_type: "code",
client_id: WHOOP_CLIENT_ID,
redirect_uri: WHOOP_REDIRECT,
    scope: "read:recovery",
    scope: "read:recovery read:cycles",
state: "workout-app"
});
window.location.href = url;
}

async function fetchWhoopHRV() {
const token = getWhoopToken();
if(!token) return null;
try {
const res = await fetch(WHOOP_HRV_URL, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ accessToken: token })
});
const data = await res.json();
return data.hrv || null;
} catch(e) { return null; }
}
