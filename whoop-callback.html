<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connecting Whoop...</title>
<style>
  body { background: #0f1117; color: #e8edf5; font-family: Georgia, serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .msg { text-align: center; max-width: 400px; padding: 20px; }
  .msg div:first-child { font-size: 32px; margin-bottom: 12px; }
  .msg p { color: #6b7a90; font-size: 15px; }
  .error { color: #f87171; }
  pre { text-align: left; background: #141b26; padding: 12px; border-radius: 8px; font-size: 12px; color: #4ade80; word-break: break-all; white-space: pre-wrap; margin-top: 12px; }
</style>
</head>
<body>
<div class="msg" id="msg">
  <div>⏳</div>
  <p>Connecting to Whoop...</p>
</div>
<script>
const WHOOP_AUTH_URL = "https://whoopauth-998100432483.us-central1.run.app";

async function handleCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const error = params.get("error");

  const debugInfo = "URL: " + window.location.href + "\n\nParams:\n" +
    Array.from(params.entries()).map(([k,v]) => k + " = " + v).join("\n");

  if (error || !code) {
    document.getElementById("msg").innerHTML =
      '<div>❌</div><p class="error">Authorization failed: ' + (error || "no code") + '</p><pre>' + debugInfo + '</pre>';
    return;
  }

  document.getElementById("msg").innerHTML =
    '<div>⏳</div><p>Exchanging code for token...</p><pre>' + debugInfo + '</pre>';

  try {
    const res = await fetch(WHOOP_AUTH_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code })
    });
    const text = await res.text();
    const data = JSON.parse(text);
    if (data.access_token) {
      localStorage.setItem("whoop_access_token", data.access_token);
      if (data.refresh_token) localStorage.setItem("whoop_refresh_token", data.refresh_token);
      document.getElementById("msg").innerHTML = '<div>✅</div><p>Connected! Returning to app...</p>';
      setTimeout(() => { window.location.href = "/"; }, 2000);
    } else {
      document.getElementById("msg").innerHTML =
        '<div>❌</div><p class="error">Token error</p><pre>' + text + '</pre>';
    }
  } catch (err) {
    document.getElementById("msg").innerHTML =
      '<div>❌</div><p class="error">Request failed: ' + err.message + '</p>';
  }
}

handleCallback();
</script>
</body>
</html>
